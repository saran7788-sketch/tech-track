<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TechTrack – Your Personal Growth Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fafafa;--card:#fff;--tx:#18181b;--mu:#71717a;--bd:#e4e4e7;--ac:#6366f1;--ok:#10b981;--wa:#f59e0b;--er:#ef4444;--h0:#ececf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--card:#17171c;--tx:#ececf0;--mu:#8b8b97;--bd:#2a2a32;--h0:#23232b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f12;--card:#17171c;--tx:#ececf0;--mu:#8b8b97;--bd:#2a2a32;--h0:#23232b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#app{display:flex;min-height:100vh}
nav{width:216px;padding:16px 10px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto;flex:none;background:var(--card)}
nav h1{font-size:16px;margin:4px 10px 14px}nav h1 span{color:var(--ac)}
nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--mu);cursor:pointer;margin-bottom:2px;transition:.15s}
nav a:hover{background:var(--h0)}nav a.on{background:var(--ac);color:#fff}
main{flex:1;padding:24px;max-width:1100px;min-width:0;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mu);margin-bottom:18px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.c .n{font-size:26px;font-weight:700}.c .l{color:var(--mu);font-size:12px}
.bar{height:7px;background:var(--h0);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
button,input,select,textarea{font:inherit;color:var(--tx)}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}.b.s{background:var(--h0);color:var(--tx)}.b.d{background:var(--er)}.b.x{padding:3px 8px;font-size:12px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.tag{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--h0);color:var(--mu)}
.tag.ok{background:#10b98122;color:var(--ok)}.tag.wa{background:#f59e0b22;color:var(--wa)}.tag.er{background:#ef444422;color:var(--er)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:500;font-size:12px}
.wrap{overflow-x:auto}
#mo{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#mo>div{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:460px;max-height:90vh;overflow:auto;border:1px solid var(--bd)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{aspect-ratio:1;border-radius:7px;background:var(--h0);font-size:11px;padding:3px;color:var(--mu)}
.cal .full{background:var(--ok);color:#fff}.cal .part{background:var(--wa);color:#fff}.cal .miss{background:#ef444433}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}.hm i{width:12px;height:12px;border-radius:3px;background:var(--h0)}
.toast{position:fixed;right:14px;bottom:14px;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:9px;z-index:20}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;gap:4px;border:0;border-bottom:1px solid var(--bd)}nav h1{display:none}nav a{white-space:nowrap;margin:0}main{padding:14px}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="mo"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dstr=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};const today=()=>ago(0);
const CATS={'Programming':['C','C++','Java','Python','JavaScript','Data Structures and Algorithms'],'Web Development':['HTML','CSS','JavaScript','React','Node.js','Full Stack Development'],'CS Fundamentals':['Operating Systems','DBMS','Computer Networks','OOP','Software Engineering'],'Emerging Tech':['Artificial Intelligence','Machine Learning','Generative AI','Cloud Computing','Cybersecurity']};
const TOP={'Python':['Syntax','Functions','OOP','Decorators','Async'],'React':['Components','Hooks','Context','Routing','Performance'],'DBMS':['ER model','Normalization','SQL joins','Transactions','Indexing'],'Data Structures and Algorithms':['Arrays','Linked lists','Trees','Graphs','Dynamic programming']};
let S,view='Dashboard',uidv='local',dbDoc=null,tmr;
function seed(){let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;const skills=[];
for(const[c,l]of Object.entries(CATS))for(const n of l)skills.push({id:uid(),name:n,cat:c,goal:'Get comfortable with '+n,diff:'Medium',conf:1+Math.floor(rnd()*5),prog:0,notes:'',res:'',target:20,topics:(TOP[n]||['Basics','Intermediate','Advanced']).map((t,i)=>({id:uid(),t,done:rnd()<.4,sub:''}))});
const logs=[];for(let i=45;i>=0;i--)if(rnd()<.72){const sk=skills[Math.floor(rnd()*skills.length)];logs.push({id:uid(),date:ago(i),skill:sk.id,topic:sk.topics[0].t,hrs:+(0.5+rnd()*3).toFixed(1),got:'Covered key ideas',hard:'',rev:'',conf:1+Math.floor(rnd()*5),status:'Completed'})}
const find=n=>skills.find(s=>s.name===n).id;
return{skills,logs,goals:[{id:uid(),title:'Finish React fundamentals',desc:'Hooks and routing',type:'Monthly',skill:find('React'),start:ago(10),end:ago(-12),dh:1,wh:7,pri:'High',prog:40},{id:uid(),title:'Solve 5 DSA problems',desc:'',type:'Weekly',skill:find('Data Structures and Algorithms'),start:ago(2),end:ago(-2),dh:1,wh:5,pri:'Medium',prog:20}],revs:[],journal:{},settings:{theme:'auto',daily:2}}}
const sk=id=>S.skills.find(s=>s.id===id),skn=id=>sk(id)?.name||'(deleted)';
const sprog=s=>s.topics.length?Math.round(s.topics.filter(t=>t.done).length/s.topics.length*100):s.prog;
const hrsOn=d=>S.logs.filter(l=>l.date===d).reduce((a,l)=>a+ +l.hrs,0);
const sumHrs=(a,b)=>{let t=0;for(let i=a;i>=b;i--)t+=hrsOn(ago(i));return t};
function streak(){let n=0,i=hrsOn(today())>0?0:1;while(hrsOn(ago(i))>0){n++;i++}return n}
function save(){try{localStorage.setItem('tt',JSON.stringify(S))}catch(e){}clearTimeout(tmr);tmr=setTimeout(()=>dbDoc&&dbDoc.set({json:JSON.stringify(S)}).catch(()=>toast('Cloud save failed')),400)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
// modal form
function form(title,fields,vals,ok,del){vals=vals||{};const m=$('#mo');
$('#mb').innerHTML=`<h2 style="font-size:18px">${title}</h2><div id="ff">${fields.map(f=>`<label>${f.l}</label>`+(f.t==='select'?`<select name="${f.k}">${f.o.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${String(vals[f.k]??'')===String(v)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`:f.t==='area'?`<textarea name="${f.k}" rows="2">${esc(vals[f.k])}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.min!=null?`min="${f.min}" max="${f.max}" step="${f.step||1}"`:''} value="${esc(vals[f.k])}">`)).join('')}</div><p id="er" style="color:var(--er);margin:8px 0 0"></p><div class="row" style="margin-top:12px"><button class="b" id="sv">Save</button><button class="b s" id="cx">Cancel</button>${del?'<span class="sp"></span><button class="b d" id="dl">Delete</button>':''}</div>`;
m.style.display='flex';const close=()=>m.style.display='none';$('#cx').onclick=close;if(del)$('#dl').onclick=()=>{if(confirm('Delete this item?')){del();close()}};
$('#sv').onclick=()=>{const o={};for(const f of fields){const v=$('#ff [name='+f.k+']').value.trim();if(f.r&&!v)return $('#er').textContent=f.l+' is required';if(f.t==='number'&&v!==''&&(isNaN(+v)||+v<f.min||+v>f.max))return $('#er').textContent=f.l+' must be '+f.min+'–'+f.max;o[f.k]=f.t==='number'?(v===''?0:+v):v}
const e=ok(o);if(e)return $('#er').textContent=e;close();save();render()}}
const skOpts=()=>S.skills.map(s=>[s.id,s.name]);
const bar=p=>`<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`;
// charts
function bars(data,h=140,col='var(--ac)'){const mx=Math.max(1,...data.map(d=>d[1])),w=100/data.length;return`<svg viewBox="0 0 100 ${h/2}" preserveAspectRatio="none" style="width:100%;height:${h}px">${data.map((d,i)=>{const bh=d[1]/mx*(h/2-8);return`<rect x="${i*w+w*.15}" y="${h/2-bh}" width="${w*.7}" height="${bh}" rx=".8" fill="${col}"><title>${esc(d[0])}: ${d[1].toFixed(1)}h</title></rect>`}).join('')}</svg><div class="row" style="justify-content:space-between;color:var(--mu);font-size:11px"><span>${esc(data[0][0])}</span><span>${esc(data[data.length-1][0])}</span></div>`}
function hbars(data){const mx=Math.max(1,...data.map(d=>d[1]));return data.map(d=>`<div class="row"><span style="width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d[0])}</span><div class="bar sp"><i style="width:${d[1]/mx*100}%"></i></div><span style="width:44px;text-align:right">${d[2]||d[1].toFixed(1)}</span></div>`).join('')||'<p class="sub">No data yet.</p>'}
const daily=n=>Array.from({length:n},(_,i)=>[ago(n-1-i).slice(5),hrsOn(ago(n-1-i))]);
const stat=(n,l)=>`<div class="c"><div class="n">${n}</div><div class="l">${l}</div></div>`;
function skillHrs(){const m={};S.logs.forEach(l=>m[l.skill]=(m[l.skill]||0)+ +l.hrs);return Object.entries(m).map(([k,v])=>[skn(k),v]).sort((a,b)=>b[1]-a[1])}
// views
const V={
Dashboard(){const T=S.skills.flatMap(s=>s.topics),done=T.filter(t=>t.done).length,tot=S.logs.reduce((a,l)=>a+ +l.hrs,0),gp=S.goals.length?Math.round(S.goals.reduce((a,g)=>a+ +g.prog,0)/S.goals.length):0,wk=sumHrs(6,0),mo=sumHrs(29,0),wt=S.settings.daily*7;
const soon=S.goals.filter(g=>{const d=(new Date(g.end)-new Date(today()))/864e5;return g.prog<100&&d<=3});
return`<h2>Welcome back 👋</h2><div class="sub">Here’s how your learning is going.</div>
${soon.length?`<div class="c" style="border-color:var(--wa);margin-bottom:12px">⏰ Deadline approaching: ${soon.map(g=>esc(g.title)+' ('+g.end+')').join(', ')}</div>`:''}
<div class="g">${stat(tot.toFixed(1)+'h','Total learning hours')}${stat(S.skills.length,'Skills')}${stat(done,'Topics completed')}${stat(T.length-done,'Topics pending')}${stat('🔥 '+streak(),'Day streak')}${stat(gp+'%','Goal completion')}</div>
<div class="g g2"><div class="c"><b>This week</b> <span class="tag">${wk.toFixed(1)} / ${wt}h</span>${bar(wk/wt*100)}<b>This month</b> <span class="tag">${mo.toFixed(1)} / ${S.settings.daily*30}h</span>${bar(mo/(S.settings.daily*30)*100)}</div>
<div class="c"><b>Today</b><div class="n">${hrsOn(today()).toFixed(1)}h</div><div class="l">Target ${S.settings.daily}h</div>${bar(hrsOn(today())/S.settings.daily*100)}</div></div>
<div class="g g2"><div class="c"><b>Hours, last 14 days</b>${bars(daily(14))}</div><div class="c"><b>Top skills by hours</b><div style="margin-top:8px">${hbars(skillHrs().slice(0,6))}</div></div></div>`},
'My Skills'(){const cats=[...new Set(S.skills.map(s=>s.cat))];return`<div class="row"><div><h2>My Skills</h2><div class="sub">Topics, confidence and progress per skill.</div></div><span class="sp"></span><button class="b" onclick="editSkill()">+ Add skill</button></div>`+cats.map(c=>`<h3>${esc(c)}</h3><div class="g">${S.skills.filter(s=>s.cat===c).map(s=>`<div class="c"><div class="row"><b class="sp">${esc(s.name)}</b><span class="tag">${esc(s.diff)}</span></div>${bar(sprog(s))}<div class="l">${sprog(s)}% · confidence ${'★'.repeat(s.conf)}${'☆'.repeat(5-s.conf)} · ${s.topics.filter(t=>t.done).length}/${s.topics.length} topics</div><div class="row" style="margin-top:8px"><button class="b s x" onclick="openSkill('${s.id}')">Open</button><button class="b s x" onclick="editSkill('${s.id}')">Edit</button></div></div>`).join('')}</div>`).join('')},
'Daily Tracker'(){const t=today();return`<div class="row"><div><h2>Daily Tracker</h2><div class="sub">Log what you studied and how well you understood it.</div></div><span class="sp"></span><button class="b" onclick="editLog()">+ Log session</button></div>
<div class="c" style="margin-bottom:12px"><b>Journal for ${t}</b><textarea id="jn" rows="3" placeholder="What did I learn today?" style="margin-top:6px">${esc(S.journal[t])}</textarea><button class="b s x" style="margin-top:6px" onclick="S.journal['${t}']=$('#jn').value;save();toast('Journal saved')">Save journal</button></div>
<div class="c wrap"><table><tr><th>Date</th><th>Skill / topic</th><th>Hrs</th><th>Conf</th><th>Status</th><th></th></tr>${[...S.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(l=>`<tr><td>${l.date}</td><td><b>${esc(skn(l.skill))}</b><br><span class="l">${esc(l.topic)}</span>${l.hard?`<br><span class="l">⚠ ${esc(l.hard)}</span>`:''}</td><td>${l.hrs}</td><td>${l.conf}/5</td><td><span class="tag ${l.status==='Completed'?'ok':l.status==='Needs Revision'?'er':'wa'}">${l.status}</span></td><td><button class="b s x" onclick="editLog('${l.id}')">Edit</button></td></tr>`).join('')}</table></div>`},
Goals(){return`<div class="row"><div><h2>Goals</h2><div class="sub">Daily, weekly and monthly targets.</div></div><span class="sp"></span><button class="b" onclick="editGoal()">+ New goal</button></div>`+['Daily','Weekly','Monthly'].map(ty=>`<h3>${ty} goals</h3><div class="g">${S.goals.filter(g=>g.type===ty).map(g=>{const d=Math.ceil((new Date(g.end)-new Date(today()))/864e5);return`<div class="c"><div class="row"><b class="sp">${esc(g.title)}</b><span class="tag ${g.pri==='High'?'er':g.pri==='Medium'?'wa':''}">${g.pri}</span></div><div class="l">${esc(skn(g.skill))} · ${g.dh}h/day · ${g.wh}h/week</div>${bar(g.prog)}<div class="row"><span class="l sp">${g.prog}% · due ${g.end}</span>${g.prog<100?`<span class="tag ${d<0?'er':d<=3?'wa':''}">${d<0?'overdue':d+' days left'}</span>`:'<span class="tag ok">done</span>'}</div><button class="b s x" style="margin-top:8px" onclick="editGoal('${g.id}')">Edit</button></div>`}).join('')||'<p class="sub">None yet.</p>'}</div>`).join('')},
'Learning Calendar'(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),n=new Date(y,m+1,0).getDate(),off=new Date(y,m,1).getDay(),tg=S.settings.daily;let cells='<div style="background:none"></div>'.repeat(off);
for(let d=1;d<=n;d++){const ds=dstr(new Date(y,m,d)),h=hrsOn(ds),fut=ds>today();cells+=`<div class="${fut?'':h>=tg?'full':h>0?'part':'miss'}" title="${h.toFixed(1)}h">${d}<br>${h?h.toFixed(1)+'h':''}</div>`}
let hm='';for(let i=363;i>=0;i--){const h=hrsOn(ago(i)),a=h==0?0:Math.min(1,.25+h/tg*.75);hm+=`<i title="${ago(i)}: ${h.toFixed(1)}h" style="${h?`background:var(--ok);opacity:${a}`:''}"></i>`}
return`<h2>Learning Calendar</h2><div class="sub">${now.toLocaleString('en',{month:'long',year:'numeric'})} · <span class="tag ok">target met</span> <span class="tag wa">partial</span> <span class="tag er">missed</span></div><div class="g g2"><div class="c"><div class="cal">${'SMTWTFS'.split('').map(x=>`<div style="background:none;aspect-ratio:auto">${x}</div>`).join('')}${cells}</div></div><div class="c wrap"><b>Contribution heatmap (52 weeks)</b><div class="hm" style="margin-top:8px">${hm}</div></div></div>`},
'Revision Center'(){const due=S.revs.filter(r=>!r.done);const rep={};S.revs.forEach(r=>rep[r.skill+'|'+r.topic]=(rep[r.skill+'|'+r.topic]||0)+1);const hard=Object.entries(rep).filter(e=>e[1]>1);
return`<div class="row"><div><h2>Revision Center</h2><div class="sub">Topics marked difficult land here automatically.</div></div><span class="sp"></span><button class="b" onclick="editRev()">+ Add</button></div>${hard.length?`<div class="c" style="margin-bottom:12px"><b>🔁 Repeated difficulties</b><br>${hard.map(h=>esc(skn(h[0].split('|')[0])+' – '+h[0].split('|')[1])+' ×'+h[1]).join('<br>')}</div>`:''}
<div class="c wrap"><table><tr><th>Topic</th><th>Revise on</th><th>Status</th><th></th></tr>${[...S.revs].sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<tr><td><b>${esc(skn(r.skill))}</b><br><span class="l">${esc(r.topic)}</span></td><td>${r.date}${!r.done&&r.date<today()?' <span class="tag er">overdue</span>':''}</td><td>${r.done?`<span class="tag ok">revised · ${r.rating}/5</span>`:'<span class="tag wa">pending</span>'}</td><td>${r.done?'':`<button class="b x" onclick="markRev('${r.id}')">Mark revised</button> `}<button class="b s x" onclick="editRev('${r.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan=4 class="sub">Nothing to revise 🎉</td></tr>'}</table></div>`},
Analytics(){const wk=sumHrs(6,0),pw=sumHrs(13,7),mo=sumHrs(29,0),pm=sumHrs(59,30),act=Array.from({length:30},(_,i)=>hrsOn(ago(i))>0).filter(Boolean).length,cg=S.goals.filter(g=>g.prog>=100).length;
const ranked=[...S.skills].sort((a,b)=>b.conf-a.conf);const wkly=Array.from({length:8},(_,i)=>['W-'+(7-i),sumHrs(i*-7+55,i*-7+49)]);
return`<h2>Analytics</h2><div class="sub">Weekly and monthly reports from your real activity.</div><div class="g">${stat(wk.toFixed(1)+'h','This week ('+(wk>=pw?'▲':'▼')+' vs '+pw.toFixed(1)+'h last)')}${stat(mo.toFixed(1)+'h','Last 30 days ('+(mo>=pm?'▲':'▼')+' vs '+pm.toFixed(1)+'h prior)')}${stat(Math.round(act/30*100)+'%','30-day consistency')}${stat(cg+' / '+(S.goals.length-cg),'Goals done / pending')}</div>
<div class="g g2"><div class="c"><b>Daily hours (30 days)</b>${bars(daily(30))}</div><div class="c"><b>Weekly hours (8 weeks)</b>${bars(wkly,140,'var(--ok)')}</div><div class="c"><b>Most studied</b><div style="margin-top:8px">${hbars(skillHrs().slice(0,8))}</div></div><div class="c"><b>Skill-wise progress</b><div style="margin-top:8px">${hbars(S.skills.slice().sort((a,b)=>sprog(b)-sprog(a)).slice(0,8).map(s=>[s.name,sprog(s),sprog(s)+'%']))}</div></div>
<div class="c"><b>💪 Strongest (self-rated)</b><br>${ranked.slice(0,3).map(s=>esc(s.name)+' · '+s.conf+'/5').join('<br>')}</div><div class="c"><b>🎯 Weakest</b><br>${ranked.slice(-3).reverse().map(s=>esc(s.name)+' · '+s.conf+'/5').join('<br>')}</div></div>`},
Settings(){return`<h2>Settings</h2><div class="sub">Preferences and your data.</div><div class="c" style="max-width:420px"><label>Theme</label><select onchange="S.settings.theme=this.value;applyTheme();save()">${['auto','light','dark'].map(t=>`<option ${S.settings.theme===t?'selected':''}>${t}</option>`).join('')}</select><label>Daily target (hours)</label><input type="number" min="0.5" max="16" step="0.5" value="${S.settings.daily}" onchange="S.settings.daily=Math.min(16,Math.max(.5,+this.value||2));save();toast('Saved')"><div class="row" style="margin-top:14px"><button class="b s" onclick="exportData()">Export JSON</button><button class="b d" onclick="if(confirm('Reset all data to sample data?')){S=seed();save();applyTheme();render()}">Reset data</button></div></div>`},
'Technology Stack'(){return`<h2>Technology Stack</h2><div class="sub">How TechTrack is built.</div><div class="g g2"><div class="c"><b>This build</b><p>Single-file HTML/CSS/JS app with inline SVG charts. Data is saved per user through the Artifact database (and mirrored to browser storage as a fallback), so it persists across refreshes and sessions.</p></div><div class="c"><b>Data model</b><p class="l">profile/settings · skills → topics · daily logs · goals · revision schedule · journal. All dashboard, calendar and analytics numbers are computed from these records.</p></div><div class="c"><b>Your requested stack</b><p>React + TypeScript, Tailwind, Supabase, Recharts and Lucide. Published pages can’t reach outside services or compile TypeScript, so I can deliver that version as a separate project for you to run yourself.</p></div></div>`}};
// actions
function openSkill(id){const s=sk(id);const m=$('#mo');$('#mb').innerHTML=`<h2 style="font-size:18px">${esc(s.name)}</h2><div class="l">${esc(s.goal)} · target ${s.target}h</div>${bar(sprog(s))}${s.notes?`<p>📝 ${esc(s.notes)}</p>`:''}${s.res?`<p>🔗 ${esc(s.res)}</p>`:''}<div id="tl">${s.topics.map(t=>`<div class="row"><label style="margin:2px 0;color:var(--tx);flex:1"><input type="checkbox" style="width:auto" ${t.done?'checked':''} onchange="tg('${id}','${t.id}')"> ${esc(t.t)}</label><button class="b s x" onclick="delTopic('${id}','${t.id}')">✕</button></div>`).join('')||'<p class="sub">No topics yet.</p>'}</div><div class="row" style="margin-top:10px"><input id="nt" placeholder="New topic or subtopic" style="flex:1"><button class="b" onclick="addTopic('${id}')">Add</button></div><div class="row" style="margin-top:12px"><button class="b s" onclick="$('#mo').style.display='none';render()">Close</button></div>`;m.style.display='flex'}
function tg(a,b){const t=sk(a).topics.find(x=>x.id===b);t.done=!t.done;save()}
function addTopic(id){const v=$('#nt').value.trim();if(!v)return;sk(id).topics.push({id:uid(),t:v,done:false});save();openSkill(id)}
function delTopic(a,b){const s=sk(a);s.topics=s.topics.filter(t=>t.id!==b);save();openSkill(a)}
function editSkill(id){const s=id?sk(id):null;form(s?'Edit skill':'Add skill',[{k:'name',l:'Name',r:1},{k:'cat',l:'Category',t:'select',o:[...Object.keys(CATS),'Custom']},{k:'goal',l:'Learning goal',t:'area'},{k:'target',l:'Target hours',t:'number',min:1,max:2000},{k:'diff',l:'Difficulty',t:'select',o:['Easy','Medium','Hard']},{k:'conf',l:'Confidence (1–5)',t:'number',min:1,max:5},{k:'prog',l:'Manual progress % (used when no topics)',t:'number',min:0,max:100},{k:'notes',l:'Notes',t:'area'},{k:'res',l:'Resources',t:'area'}],s,o=>{if(s)Object.assign(s,o);else S.skills.push({id:uid(),topics:[],...o})},s&&(()=>{S.skills=S.skills.filter(x=>x.id!==id);S.logs=S.logs.filter(l=>l.skill!==id);S.revs=S.revs.filter(r=>r.skill!==id);save();render()}))}
function editLog(id){const l=id?S.logs.find(x=>x.id===id):{date:today(),hrs:1,conf:3,status:'In Progress'};form(id?'Edit session':'Log session',[{k:'date',l:'Date',t:'date',r:1},{k:'skill',l:'Skill',t:'select',o:skOpts()},{k:'topic',l:'Topic studied',r:1},{k:'hrs',l:'Time spent (hours)',t:'number',min:.1,max:24,step:.1},{k:'got',l:'What I understood',t:'area'},{k:'hard',l:'What I found difficult',t:'area'},{k:'rev',l:'What I need to revise',t:'area'},{k:'conf',l:'Confidence (1–5)',t:'number',min:1,max:5},{k:'status',l:'Status',t:'select',o:['Completed','In Progress','Needs Revision']}],l,o=>{if(!S.skills.length)return'Add a skill first';if(id)Object.assign(l,o);else S.logs.push({id:uid(),...o});if(o.status==='Needs Revision'||o.hard){if(!S.revs.some(r=>!r.done&&r.skill===o.skill&&r.topic===o.topic)){S.revs.push({id:uid(),skill:o.skill,topic:o.topic,date:ago(-2),done:false,rating:0});toast('Added to Revision Center')}}const s=sk(o.skill);if(s)s.conf=o.conf},id&&(()=>{S.logs=S.logs.filter(x=>x.id!==id);save();render()}))}
function editGoal(id){const g=id?S.goals.find(x=>x.id===id):{type:'Weekly',start:today(),end:ago(-7),dh:1,wh:7,pri:'Medium',prog:0};form(id?'Edit goal':'New goal',[{k:'title',l:'Title',r:1},{k:'desc',l:'Description',t:'area'},{k:'type',l:'Type',t:'select',o:['Daily','Weekly','Monthly']},{k:'skill',l:'Related skill',t:'select',o:skOpts()},{k:'start',l:'Start date',t:'date',r:1},{k:'end',l:'Target date',t:'date',r:1},{k:'dh',l:'Daily target hours',t:'number',min:0,max:24,step:.5},{k:'wh',l:'Weekly target hours',t:'number',min:0,max:168,step:.5},{k:'pri',l:'Priority',t:'select',o:['Low','Medium','High']},{k:'prog',l:'Progress %',t:'number',min:0,max:100}],g,o=>{if(o.end<o.start)return'Target date must be after start date';if(id)Object.assign(g,o);else S.goals.push({id:uid(),...o})},id&&(()=>{S.goals=S.goals.filter(x=>x.id!==id);save();render()}))}
function editRev(id){const r=id?S.revs.find(x=>x.id===id):{date:ago(-2)};form(id?'Edit revision':'Add revision',[{k:'skill',l:'Skill',t:'select',o:skOpts()},{k:'topic',l:'Topic',r:1},{k:'date',l:'Revision date',t:'date',r:1}],r,o=>{if(id)Object.assign(r,o);else S.revs.push({id:uid(),done:false,rating:0,...o})},id&&(()=>{S.revs=S.revs.filter(x=>x.id!==id);save();render()}))}
function markRev(id){const r=S.revs.find(x=>x.id===id);form('Rate your understanding',[{k:'rating',l:'Understanding after revision (1–5)',t:'number',min:1,max:5}],{rating:3},o=>{r.done=true;r.rating=o.rating;if(o.rating<3){S.revs.push({id:uid(),skill:r.skill,topic:r.topic,date:ago(-3),done:false,rating:0});toast('Still shaky – rescheduled')}})}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});claude.use('downloads').then(d=>d?d.save({filename:'techtrack.json',data:b}):toast('Export unavailable')).catch(()=>{})}
function render(){$('#nav').innerHTML='<h1>⚡ Tech<span>Track</span></h1>'+Object.keys(V).map(k=>`<a class="${k===view?'on':''}" onclick="view='${k}';render();scrollTo(0,0)">${k}</a>`).join('');$('#main').innerHTML=V[view]()}
async function init(){let st=null;try{st=JSON.parse(localStorage.getItem('tt'))}catch(e){}S=st||seed();applyTheme();render();
try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(db&&user){const id=await user.id();if(id){dbDoc=db.doc('data/users/'+id+'/state');const snap=await dbDoc.get();if(snap.exists){S=JSON.parse(snap.data().json);applyTheme();render()}else save()}}}catch(e){}}
init();
</script></body></html>
